name: Databricks CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: lint + offline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Unit tests (without Databricks credentials)
        env:
          DATABRICKS_SKIP_CONNECT: "1"
        run: uv run pytest -v

  validate:
    name: bundle validate (prod)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_catalog: ${{ vars.DATABRICKS_CATALOG_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.8.0
        with:
          version: 1.22.1
      - run: databricks bundle validate -t prod

  deploy:
    name: bundle deploy (prod)
    runs-on: ubuntu-latest
    needs: validate
    environment: prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_catalog: ${{ vars.DATABRICKS_CATALOG_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.8.0
        with:
          version: 1.22.1
      - run: databricks bundle deploy -t prod
      - name: Resumo do deploy
        run: databricks bundle summary -t prod
