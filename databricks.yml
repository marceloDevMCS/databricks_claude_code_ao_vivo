# This is a Declarative Automation Bundle definition for databricks_claude_code_ao_vivo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_claude_code_ao_vivo
  uuid: be402c8e-6d17-425f-9933-c226d4d27488

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d988e786-a705.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-d988e786-a705.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/marcelojmi@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/marcelojmi@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: marcelojmi@gmail.com
        level: CAN_MANAGE
