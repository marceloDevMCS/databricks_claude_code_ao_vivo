bundle:
  name: databricks_claude_code_ao_vivo
  uuid: be402c8e-6d17-425f-9933-c226d4d27488

include:
  - resources/*.yml

experimental:
  skip_name_prefix_for_schema: true

# Variable declarations. Catalog values are assigned per target below.
variables:
  catalog:
    description: The Unity Catalog catalog holding the bronze/silver/gold schemas (must already exist).
    # Supply per environment through DATABRICKS_BUNDLE_VAR_catalog.
    default: bakehouse_dev
  bronze_schema:
    description: Schema name for the bronze (raw ingestion) layer
    default: bronze
  silver_schema:
    description: Schema name for the silver (cleaned/conformed) layer
    default: silver
  gold_schema:
    description: Schema name for the gold (BI-ready marts) layer
    default: gold
  warehouse_id:
    description: SQL warehouse used to test and serve the AI/BI dashboard
    lookup:
      # ⚠️ TROQUE pelo nome EXATO de um SQL Warehouse que exista no seu workspace.
      #    O deploy falha aqui se o nome não bater.
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:  
    mode: development
    default: true
    workspace:
      host: https://dbc-d988e786-a705.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-d988e786-a705.cloud.databricks.com
      root_path: /Workspace/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse
    run_as:
      service_principal_name: ca681ee2-3d75-4b5c-aa79-708fec7f336b
    permissions:
      - user_name: marcelojmi@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ca681ee2-3d75-4b5c-aa79-708fec7f336b
        level: CAN_MANAGE
